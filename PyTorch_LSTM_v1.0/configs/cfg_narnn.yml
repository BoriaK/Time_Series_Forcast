batch_size: 32
batch_size_cuda: 32

seq_len: 4096
seq_len_cuda: 16384

# Autoregressive window length (used by Trafficdataset and NARNN)
win_len: 128 # (number of time samples as input to the MLP)
hidden_size: 64 # (number of hidden units (neurons) in each hidden layer of the MLP)
num_layers: 10 # (number of hidden layers in the MLP)
n_predictions: 1 # (number of time samples to predict ahead)
step: 1

n_epochs: 1000
wd: 0.0001
max_lr: 0.001
betas: [0.9, 0.99]

net_type: narnn

save_path: ./outputs
load_path: ./outputs/narnn
#load_path:
log_interval: 100
save_interval: 100

# Augmentations
augs:

# d is used by Trafficdataset, not model
d: [0.2]
